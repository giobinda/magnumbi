# Named connections. ${VAR} / ${VAR:-default} are expanded from the environment, so secrets
# (passwords in DSNs) never need to live in this file.
#
# Only ScramDB for now; connectors for other databases are on the roadmap (see README).
connections:
  # Magnum BI's own ScramDB database (MAGNUM_DATABASE_URL) unless MAGNUM_DATA_DSN points
  # elsewhere, e.g. postgresql://reader:${SCRAMDB_READER_PASSWORD}@analytics:5432/warehouse.
  # Queries run in read-only transactions.
  scramdb:
    type: scramdb
    dsn: "${MAGNUM_DATA_DSN:-}"
    statement_timeout_ms: 60000
