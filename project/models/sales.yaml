# Semantic model: what people can see and combine in Explore and on dashboards.
# Synthetic data: load it with `make seed` (magnum-bi seed-sample).
name: sales
label: Store sales (sample)
description: Synthetic store sales over the last 18 months, generated by `magnum-bi seed-sample`
connection: scramdb
table: sample_sales

dimensions:
  - name: sold_at
    label: Sale time
    type: time
  - name: region
    label: Region
  - name: store
    label: Store
    aggregation: count_distinct
  - name: category
    label: Category
  - name: amount
    label: Amount
    type: number
  - name: qty
    label: Quantity
    type: number

measures:
  - name: revenue
    label: Revenue
    type: sum
    sql: amount
    format: currency
  - name: units
    label: Units
    type: sum
    sql: qty
  - name: transactions
    label: Transactions
    type: count
  - name: avg_ticket
    label: Avg ticket
    type: avg
    sql: amount
    format: currency
  - name: revenue_per_unit
    label: Revenue per unit
    type: number
    sql: SUM(amount) / NULLIF(SUM(qty), 0)
    format: currency

hierarchies:
  location: [region, store]
