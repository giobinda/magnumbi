# Semantic model: what people can see and combine in Explore and on dashboards.
# Synthetic data: load it with `make seed` (magnum-bi seed-sample).
name: sales
label: Store sales (sample)
description: Synthetic store sales over the last 18 months, generated by `magnum-bi seed-sample`
connection: warehouse
table: sample_sales
# results may be reused for 15 minutes (in each organisation's own ScramDB); omit for live data
cache: 15m

dimensions:
  - name: sold_at
    label: Sale time
    type: time
  - name: region
    label: Region
  - name: store
    label: Store
    aggregation: count_distinct
  - name: category
    label: Category
  - name: amount
    label: Amount
    type: number
  - name: qty
    label: Quantity
    type: number

measures:
  - name: revenue
    label: Revenue
    type: sum
    sql: amount
    format: currency
  - name: units
    label: Units
    type: sum
    sql: qty
  - name: transactions
    label: Transactions
    type: count
  - name: avg_ticket
    label: Avg ticket
    type: avg
    sql: amount
    format: currency
  - name: revenue_per_unit
    label: Revenue per unit
    # a formula: a calculation on other measures (no SQL; division by zero gives empty)
    type: formula
    formula: revenue / units
    format: currency

hierarchies:
  location: [region, store]
