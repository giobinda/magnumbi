[workspace]
resolver = "3"
members = ["backend"]

[workspace.package]
version = "0.1.6"
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-only"

# DuckDB's C++ is unusably slow unoptimised: optimise it even in development builds (built once)
[profile.dev.package.libduckdb-sys]
opt-level = 3
