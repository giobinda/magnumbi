apiVersion: v1
kind: Pod
metadata:
  name: {{ include "magnum.name" . }}-test
  labels: {{- include "magnum.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
spec:
  restartPolicy: Never
  containers:
    - name: health
      image: docker.io/library/busybox:1.36
      command: ["wget", "-qO-", "http://{{ include "magnum.name" . }}:{{ .Values.service.port }}/api/health"]
