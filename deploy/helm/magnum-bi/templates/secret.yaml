{{- if and .Values.production (not (hasPrefix "https://" .Values.publicUrl)) }}
{{- fail "production needs publicUrl: the https address people use (or set production=false to try it out)" }}
{{- end }}
{{- if and (not .Values.scramdb.enabled) (not .Values.database.url) (not .Values.database.existingSecret) }}
{{- fail "no database: enable scramdb, or set database.url or database.existingSecret" }}
{{- end }}
{{- if and (gt (int .Values.replicaCount) 1) .Values.persistence.enabled (ne .Values.persistence.accessMode "ReadWriteMany") }}
{{- fail "several replicas share the data volume: set persistence.accessMode=ReadWriteMany (or replicaCount=1)" }}
{{- end }}
{{- $name := include "magnum.name" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "magnum.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # the secret key outlives an uninstall: data stays readable
type: Opaque
data:
  {{- if not .Values.secretKey.existingSecret }}
  {{- if and $existing (index $existing.data "secret-key") }}
  secret-key: {{ index $existing.data "secret-key" }}
  {{- else }}
  secret-key: {{ randBytes 32 | b64enc }}   # randBytes is base64 already: the key, as `magnum-bi gen-key` prints it
  {{- end }}
  {{- end }}
  {{- if not .Values.database.existingSecret }}
  {{- if .Values.database.url }}
  database-url: {{ .Values.database.url | b64enc }}
  {{- else }}
  database-url: {{ printf "postgresql://scramdb@%s:5432/scramdb" (include "magnum.scramdb" .) | b64enc }}
  {{- end }}
  {{- end }}
  {{- if .Values.admin.password }}
  admin-password: {{ .Values.admin.password | b64enc }}
  {{- end }}
