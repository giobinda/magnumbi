{{- if .Values.scramdb.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "magnum.scramdb" . }}
  labels: {{- include "magnum.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "magnum.scramdb" . }}
  replicas: 1
  selector:
    matchLabels: {{- include "magnum.scramdbSelector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "magnum.scramdbSelector" . | nindent 8 }}
    spec:
      containers:
        - name: scramdb
          image: {{ .Values.scramdb.image }}
          ports:
            - {name: postgres, containerPort: 5432}
          volumeMounts:
            - {name: data, mountPath: /var/lib/scramdb}
          readinessProbe:
            tcpSocket: {port: postgres}
            periodSeconds: 10
          resources: {{- toYaml .Values.scramdb.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.scramdb.storageClass }}
        storageClassName: {{ .Values.scramdb.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.scramdb.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "magnum.scramdb" . }}
  labels: {{- include "magnum.labels" . | nindent 4 }}
spec:
  selector: {{- include "magnum.scramdbSelector" . | nindent 4 }}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
{{- if .Values.scramdb.networkPolicy }}
---
# the bundled ScramDB has no authentication: only Magnum BI may connect
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "magnum.scramdb" . }}
  labels: {{- include "magnum.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "magnum.scramdbSelector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "magnum.selector" . | nindent 14 }}
      ports:
        - {port: 5432, protocol: TCP}
{{- end }}
{{- end }}
