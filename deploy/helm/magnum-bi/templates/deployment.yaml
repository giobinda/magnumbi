apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "magnum.name" . }}
  labels: {{- include "magnum.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ if eq .Values.persistence.accessMode "ReadWriteOnce" }}Recreate{{ else }}RollingUpdate{{ end }}
  selector:
    matchLabels: {{- include "magnum.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "magnum.selector" . | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: magnum-bi
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          ports:
            - {name: http, containerPort: 8000}
          env:
            - name: MAGNUM_ENV
              value: {{ if .Values.production }}production{{ else }}development{{ end }}
            {{- if .Values.publicUrl }}
            - {name: MAGNUM_PUBLIC_URL, value: {{ .Values.publicUrl | quote }}}
            {{- end }}
            - {name: MAGNUM_SYSTEM_OWNERS, value: {{ .Values.admin.email | quote }}}
            - name: MAGNUM_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | default (include "magnum.name" .) }}
                  key: database-url
            - name: MAGNUM_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretKey.existingSecret | default (include "magnum.name" .) }}
                  key: secret-key
            {{- if .Values.admin.password }}
            - name: MAGNUM_INITIAL_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ include "magnum.name" . }}, key: admin-password}
            {{- end }}
            {{- range $k, $v := .Values.env }}
            - {name: {{ $k }}, value: {{ $v | quote }}}
            {{- end }}
            {{- range .Values.secretEnv }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef: {name: {{ .secret }}, key: {{ .key }}}
            {{- end }}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 20
            periodSeconds: 20
          startupProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 5
            failureThreshold: 60   # first start: migrations, ScramDB still starting
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim: {claimName: {{ include "magnum.name" . }}}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
