apiVersion: v1
kind: Service
metadata:
  name: {{ include "magnum.name" . }}
  labels: {{- include "magnum.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "magnum.selector" . | nindent 4 }}
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http}
