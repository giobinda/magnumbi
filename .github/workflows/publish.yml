# The image (linux/amd64 and linux/arm64) and the Helm chart on GitHub's registry
# (ghcr.io/<owner>/magnum-bi):
#   a push to main  -> image tags `edge` and `sha-<commit>`
#   a tag vX.Y.Z    -> image tags `X.Y.Z`, `X.Y`, `latest`, and the chart oci://ghcr.io/<owner>/charts/magnum-bi X.Y.Z
#   a pull request  -> builds the image and lints the chart, publishes nothing
# The tag must match the version in Cargo.toml. Each architecture is built natively on its own
# runner (ARM runners are free for public repositories) and pushed by digest; `merge` then puts
# both under the tags.
name: publish

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths-ignore: ["website/**"]   # the site isn't in the image (tags always publish)
  pull_request:
    paths-ignore: ["website/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    strategy:
      matrix:
        include:
          - {platform: linux/amd64, arch: amd64, runner: ubuntu-latest}
          - {platform: linux/arm64, arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: The tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME but Cargo.toml says $version"; exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/magnum-bi
          labels: |
            org.opencontainers.image.title=Magnum BI
            org.opencontainers.image.licenses=AGPL-3.0-only

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # by digest only: `merge` gives the two architectures their tags together
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/magnum-bi,push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Keep the digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/magnum-bi
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main
            type=sha

      - name: Tag both architectures together
        working-directory: /tmp/digests
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/magnum-bi"
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$image@sha256:%s " *)
          docker buildx imagetools inspect "$image:${{ steps.meta.outputs.version }}"

  chart:
    needs: [image, merge]
    if: always() && needs.image.result == 'success' && needs.merge.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5

      - name: Lint
        run: |
          helm lint deploy/helm/magnum-bi --set production=false
          helm lint deploy/helm/magnum-bi --set publicUrl=https://bi.example.com

      - name: The generated secret key is one the server accepts (32 bytes, base64)
        run: |
          key=$(helm template bi deploy/helm/magnum-bi --set production=false --show-only templates/secret.yaml \
            | sed -n 's/^  secret-key: \([^ ]*\).*/\1/p')
          test "$(echo "$key" | base64 -d | base64 -d | wc -c)" = 32

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          version=${GITHUB_REF_NAME#v}
          echo "$TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm package deploy/helm/magnum-bi --version "$version" --app-version "$version"
          helm push "magnum-bi-$version.tgz" "oci://ghcr.io/$owner/charts"
