# The image and the Helm chart on GitHub's registry (ghcr.io/<owner>/magnum-bi):
#   a push to main  -> image tags `edge` and `sha-<commit>`
#   a tag vX.Y.Z    -> image tags `X.Y.Z`, `X.Y`, `latest`, and the chart oci://ghcr.io/<owner>/charts/magnum-bi X.Y.Z
#   a pull request  -> builds the image and lints the chart, publishes nothing
# The tag must match the version in Cargo.toml.
name: publish

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths-ignore: ["website/**"]   # the site isn't in the image (tags always publish)
  pull_request:
    paths-ignore: ["website/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME but Cargo.toml says $version"; exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/magnum-bi
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main
            type=sha
          labels: |
            org.opencontainers.image.title=Magnum BI
            org.opencontainers.image.licenses=AGPL-3.0-only

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Lint
        run: |
          helm lint deploy/helm/magnum-bi --set production=false
          helm lint deploy/helm/magnum-bi --set publicUrl=https://bi.example.com

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          version=${GITHUB_REF_NAME#v}
          echo "$TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm package deploy/helm/magnum-bi --version "$version" --app-version "$version"
          helm push "magnum-bi-$version.tgz" "oci://ghcr.io/$owner/charts"
