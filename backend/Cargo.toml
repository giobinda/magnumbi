[package]
name = "magnum-bi"
description = "Magnum BI: a lightweight BI tool (semantic models, YAML dashboards) on ScramDB"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "magnum-bi"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
cookie = "0.18"
clap = { version = "4", features = ["derive", "env"] }
deadpool-postgres = "0.14"
duckdb = { version = "1.10506", features = ["bundled", "parquet", "json"] }
jsonwebtoken = "9"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7"
rust_decimal = { version = "1", features = ["db-tokio-postgres"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
sha2 = "0.10"
sqlparser = { version = "0.55", features = ["visitor"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "v7"] }
webpki-roots = "1"
# already built for DuckDB; deflate only
zip = { version = "=6.0.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
futures-util = "0.3"
bytes = "1"
hmac = "0.13"
sha1 = "0.11"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
webauthn-rs = { version = "0.5.5", features = ["danger-allow-state-serialisation"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
webauthn-authenticator-rs = { version = "0.5.5", default-features = false, features = ["softpasskey"] }
